      <stop offset="0.3" stop-color="#0B84F8" stop-opacity="0.75"></stop>
      <stop offset="0.72" stop-color="#3A31FC" stop-opacity="0.75"></stop>
      <stop offset="1" stop-color="#3A31FC" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <g id="capa-fondo">
    <g id="campo">
      <rect id="piso" x="-500" y="-300" width="2600" height="1500" fill="url(#cf-piso)"></rect>
      <ellipse id="halo" cx="800" cy="430" rx="1250" ry="820" fill="url(#cf-halo)"></ellipse>
      <ellipse id="bruma" cx="1170" cy="840" rx="720" ry="430" fill="url(#cf-bruma)"></ellipse>
