    <g id="arcos" fill="none" stroke="url(#cf-arco)" stroke-linecap="round">
      <path id="arco-1" d="M -300 416.3 A 3180 3180 0 0 1 1900 416.3" stroke-width="1.2" opacity="0.45"></path>
      <path id="arco-2" d="M -300 501.7 A 3100 3100 0 0 1 1900 501.7" stroke-width="1.6" opacity="0.7"></path>
      <path id="arco-3" d="M -300 592.8 A 3015 3015 0 0 1 1900 592.8" stroke-width="2.4" opacity="1"></path>
      <path id="arco-4" d="M -300 689.7 A 2925 2925 0 0 1 1900 689.7" stroke-width="1.6" opacity="0.8"></path>
      <path id="arco-5" d="M -300 792.5 A 2830 2830 0 0 1 1900 792.5" stroke-width="1.2" opacity="0.55"></path>
      <path id="arco-6" d="M -300 906.9 A 2725 2725 0 0 1 1900 906.9" stroke-width="1" opacity="0.35"></path>
    </g>
