<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" id="capa-fondo-svg">
  <title>Capa de fondo — atmósfera</title>
  <defs>
    <radialGradient id="cf-halo" cx="0.5" cy="0.46" r="0.66">
      <stop offset="0" stop-color="#0B84F8" stop-opacity="0.26"></stop>
      <stop offset="0.48" stop-color="#2350FA" stop-opacity="0.13"></stop>
      <stop offset="1" stop-color="#3A31FC" stop-opacity="0"></stop>
    </radialGradient>
    <radialGradient id="cf-bruma" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3A31FC" stop-opacity="0.16"></stop>
      <stop offset="1" stop-color="#3A31FC" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="cf-piso" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B84F8" stop-opacity="0"></stop>
      <stop offset="0.62" stop-color="#2350FA" stop-opacity="0.07"></stop>
      <stop offset="1" stop-color="#3A31FC" stop-opacity="0.17"></stop>
